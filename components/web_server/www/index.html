<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Drug Delivery Robot — Control Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0F1C;
    --surface:#121A2C;
    --surface-2:#182238;
    --surface-3:#1E2A45;
    --border:#263252;
    --border-soft:#1c2740;
    --text:#EAF0FB;
    --text-dim:#8CA0C4;
    --text-faint:#5B6C8E;
    --accent:#2FE0C5;
    --accent-dim:rgba(47,224,197,.14);
    --accent2:#5B8CFF;
    --accent2-dim:rgba(91,140,255,.14);
    --danger:#FF5470;
    --danger-dim:rgba(255,84,112,.14);
    --warn:#FFB454;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 1200px 600px at 50% -10%, rgba(47,224,197,.07), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 48px),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .app{max-width:1280px;margin:0 auto;padding:20px 24px 40px;}

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:20px;flex-wrap:wrap;
    padding-bottom:18px;margin-bottom:22px;
    border-bottom:1px solid var(--border-soft);
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(145deg, var(--accent), var(--accent2));
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{width:20px;height:20px;}
  .brand h1{
    font-family:var(--font-display);font-weight:700;
    font-size:19px;letter-spacing:.2px;margin:0;line-height:1.15;
  }
  .brand .subtitle{
    font-family:var(--font-mono);font-size:11px;color:var(--text-faint);
    letter-spacing:.06em;text-transform:uppercase;
  }

  .connection{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .ip-input{
    background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);border-radius:9px;padding:9px 12px;
    font-family:var(--font-mono);font-size:13px;width:150px;
    transition:border-color .15s;
  }
  .ip-input::placeholder{color:var(--text-faint);}
  .ip-input:focus-visible{border-color:var(--accent);}

  .connect-btn{
    display:flex;align-items:center;gap:8px;
    background:var(--accent-dim);border:1px solid rgba(47,224,197,.35);
    color:var(--accent);border-radius:9px;padding:9px 14px;
    font-size:13px;font-weight:600;transition:all .15s;
  }
  .connect-btn:hover{background:rgba(47,224,197,.22);}
  .connect-btn.connected{
    background:var(--danger-dim);border-color:rgba(255,84,112,.35);color:var(--danger);
  }
  .connect-btn.connected:hover{background:rgba(255,84,112,.22);}
  .connect-btn svg{width:15px;height:15px;}

  .status-pill{
    display:flex;align-items:center;gap:9px;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:9px;padding:8px 14px;
  }
  .pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--text-faint);flex-shrink:0;}
  .status-pill.live .pulse-dot{
    background:var(--accent);
    box-shadow:0 0 0 0 rgba(47,224,197,.6);
    animation:pulse-ring 1.8s ease-out infinite;
  }
  @keyframes pulse-ring{
    0%{box-shadow:0 0 0 0 rgba(47,224,197,.55);}
    70%{box-shadow:0 0 0 8px rgba(47,224,197,0);}
    100%{box-shadow:0 0 0 0 rgba(47,224,197,0);}
  }
  .status-pill .label{font-family:var(--font-mono);font-size:12px;color:var(--text-dim);}
  .status-pill.live .label{color:var(--text);}

  /* ---------- Layout ---------- */
  .layout{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start;}
  @media (max-width:880px){.layout{grid-template-columns:1fr;}}

  .card{
    background:var(--surface);border:1px solid var(--border-soft);
    border-radius:var(--radius);padding:22px;
  }

  /* ---------- Mode toggle ---------- */
  .mode-toggle{
    position:relative;display:grid;grid-template-columns:1fr 1fr;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:11px;padding:4px;margin-bottom:22px;
  }
  .mode-indicator{
    position:absolute;top:4px;left:4px;bottom:4px;width:calc(50% - 4px);
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-radius:8px;transition:transform .28s cubic-bezier(.65,0,.35,1);
    z-index:0;
  }
  .mode-toggle[data-active="manual"] .mode-indicator{transform:translateX(100%);}
  .mode-btn{
    position:relative;z-index:1;background:none;border:none;
    padding:11px 0;font-family:var(--font-display);font-weight:600;
    font-size:14px;color:var(--text-dim);border-radius:8px;transition:color .2s;
  }
  .mode-btn.active{color:#06141C;}

  .panel{display:none;}
  .panel.active{display:block;animation:fade-up .25s ease both;}
  @keyframes fade-up{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  h2{font-family:var(--font-display);font-size:13px;font-weight:600;
     letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);margin:0 0 14px;}

  /* ---------- Autonomous panel ---------- */
  .color-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
  .color-swatch{
    --c:#888;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;padding:14px 6px 10px;
    display:flex;flex-direction:column;align-items:center;gap:8px;
    color:var(--text-dim);font-size:12px;font-weight:500;
    transition:all .15s;
  }
  .color-swatch::before{
    content:"";width:20px;height:20px;border-radius:50%;background:var(--c);
    box-shadow:0 0 0 0 transparent;transition:box-shadow .15s;
  }
  .color-swatch:hover{border-color:var(--c);color:var(--text);}
  .color-swatch.selected{border-color:var(--c);color:var(--text);background:var(--surface-3);}
  .color-swatch.selected::before{box-shadow:0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent);}

  .autonomous-actions{display:flex;gap:10px;margin-bottom:20px;}
  .primary-btn,.secondary-btn{
    flex:1;padding:13px;border-radius:10px;font-weight:600;font-size:14px;
    border:1px solid transparent;transition:all .15s;
  }
  .primary-btn{background:var(--accent);color:#06141C;}
  .primary-btn:hover{filter:brightness(1.08);}
  .primary-btn:disabled{opacity:.4;cursor:not-allowed;filter:none;}
  .secondary-btn{background:var(--surface-2);border-color:var(--border);color:var(--text-dim);}
  .secondary-btn:hover{border-color:var(--danger);color:var(--danger);}

  .state-readout{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;padding:14px 16px;
  }
  .state-readout .label{font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
  .state-readout .value{font-family:var(--font-mono);font-size:14px;color:var(--accent);}

  /* ---------- Manual panel ---------- */
  .dpad{
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,64px);
    gap:8px;margin-bottom:22px;max-width:320px;
  }
  .dpad-btn{
    background:var(--surface-2);border:1px solid var(--border);border-radius:12px;
    display:flex;align-items:center;justify-content:center;color:var(--text-dim);
    transition:all .1s;user-select:none;-webkit-user-select:none;touch-action:none;
  }
  .dpad-btn svg{width:22px;height:22px;}
  .dpad-btn:hover{color:var(--text);border-color:var(--accent2);}
  .dpad-btn:active,.dpad-btn.pressed{
    background:var(--accent2-dim);border-color:var(--accent2);color:var(--accent2);
    transform:scale(.96);
  }
  .dpad-btn.stop{grid-column:2;grid-row:2;color:var(--danger);}
  .dpad-btn.stop:hover{border-color:var(--danger);}
  .dpad-btn.stop:active,.dpad-btn.stop.pressed{background:var(--danger-dim);border-color:var(--danger);color:var(--danger);}
  .dpad-btn.fwd{grid-column:2;grid-row:1;}
  .dpad-btn.left{grid-column:1;grid-row:2;}
  .dpad-btn.right{grid-column:3;grid-row:2;}
  .dpad-btn.back{grid-column:2;grid-row:3;}
  .dpad-btn.ccw{grid-column:1;grid-row:1;}
  .dpad-btn.cw{grid-column:3;grid-row:1;}
  .dpad-btn.ccw svg,.dpad-btn.cw svg{width:18px;height:18px;}

  .pwm-control{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:16px;}
  .pwm-control label{
    display:flex;justify-content:space-between;font-size:12px;
    color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;
  }
  #pwmValue{font-family:var(--font-mono);color:var(--accent2);font-size:13px;}
  input[type="range"]{
    -webkit-appearance:none;width:100%;height:5px;border-radius:3px;
    background:linear-gradient(90deg,var(--accent2) var(--pct,63%), var(--border) var(--pct,63%));
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--accent2);border:3px solid var(--bg);
    box-shadow:0 0 0 1px var(--accent2);cursor:pointer;
  }

  /* ---------- E-stop ---------- */
  .estop-btn{
    width:100%;margin-top:20px;padding:15px;border-radius:12px;
    background:var(--danger-dim);border:1px solid rgba(255,84,112,.4);
    color:var(--danger);font-family:var(--font-display);font-weight:700;
    font-size:14px;letter-spacing:.06em;transition:all .12s;
  }
  .estop-btn:hover{background:var(--danger);color:#180008;}
  .estop-btn:active{transform:scale(.99);}

  /* ---------- Log panel ---------- */
  .log-panel{display:flex;flex-direction:column;max-height:640px;}
  .log-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .log-header h2{margin:0;}
  .clear-btn{
    background:none;border:1px solid var(--border);color:var(--text-faint);
    border-radius:7px;padding:5px 10px;font-size:11px;transition:all .15s;
  }
  .clear-btn:hover{color:var(--text);border-color:var(--text-dim);}
  .log-list{
    overflow-y:auto;display:flex;flex-direction:column-reverse;gap:8px;
    padding-right:4px;flex:1;min-height:200px;
  }
  .log-list::-webkit-scrollbar{width:6px;}
  .log-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  .log-entry{
    display:flex;gap:9px;padding:9px 10px;border-radius:8px;
    background:var(--surface-2);border:1px solid var(--border-soft);
    animation:slide-in .2s ease both;
  }
  @keyframes slide-in{from{opacity:0;transform:translateX(6px);}to{opacity:1;transform:translateX(0);}}
  .log-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0;}
  .log-entry.info .log-dot{background:var(--accent2);}
  .log-entry.success .log-dot{background:var(--accent);}
  .log-entry.warn .log-dot{background:var(--warn);}
  .log-entry.error .log-dot{background:var(--danger);}
  .log-body{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .log-msg{font-size:12.5px;color:var(--text);line-height:1.4;word-break:break-word;}
  .log-time{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);}
  .log-empty{color:var(--text-faint);font-size:12.5px;text-align:center;padding:30px 10px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M7 3h10M9 3v4.2a2 2 0 0 1-.5 1.32L5.8 12.4A4 4 0 0 0 8.85 19h6.3a4 4 0 0 0 3.05-6.6l-2.7-3.88A2 2 0 0 1 15 7.2V3" stroke="#06141C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M7.5 14.5h9" stroke="#06141C" stroke-width="1.8" stroke-linecap="round"/></svg>
      </div>
      <div>
        <h1>Basic Medical Delivery Robot</h1>
        <div class="subtitle">Field Control Terminal</div>
      </div>
    </div>

    <div class="connection">
      <input id="robotIp" class="ip-input" type="text" placeholder="192.168.1.x" />
      <button id="connectBtn" class="connect-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7V3M15 7V3M9 21v-4M15 21v-4M6 7h12v4a6 6 0 0 1-12 0V7Z"/></svg>
        <span id="connectLabel">Connect</span>
      </button>
      <div class="status-pill" id="statusPill">
        <div class="pulse-dot"></div>
        <span class="label" id="statusLabel">Disconnected</span>
      </div>
    </div>
  </header>

  <div class="layout">
    <section class="card">
      <div class="mode-toggle" id="modeToggle" data-active="autonomous">
        <div class="mode-indicator"></div>
        <button class="mode-btn active" data-mode="autonomous">Autonomous</button>
        <button class="mode-btn" data-mode="manual">Manual</button>
      </div>

      <!-- Autonomous -->
      <div class="panel active" id="autonomousPanel">
        <h2>Target Color</h2>
        <div class="color-grid">
          <button class="color-swatch" data-color="red" style="--c:#FF5470">Red</button>
          <button class="color-swatch" data-color="green" style="--c:#2FE0C5">Green</button>
          <button class="color-swatch" data-color="blue" style="--c:#5B8CFF">Blue</button>
          <button class="color-swatch" data-color="yellow" style="--c:#FFB454">Yellow</button>
        </div>
        <div class="autonomous-actions">
          <button id="startAuto" class="primary-btn" disabled>Start Mission</button>
          <button id="stopAuto" class="secondary-btn" disabled>Stop</button>
        </div>
        <div class="state-readout">
          <span class="label">Robot State</span>
          <span class="value" id="autoState">—</span>
        </div>
      </div>

      <!-- Manual -->
      <div class="panel" id="manualPanel">
        <h2>Navigation</h2>
        <div class="dpad">
          <button class="dpad-btn ccw" data-dir="spin_ccw" title="Spin left" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 21v-6h6"/></svg>
          </button>
          <button class="dpad-btn fwd" data-dir="forward" title="Forward" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
          <button class="dpad-btn cw" data-dir="spin_cw" title="Spin right" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 0-3 6.7"/><path d="M21 21v-6h-6"/></svg>
          </button>
          <button class="dpad-btn left" data-dir="left" title="Left" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          </button>
          <button class="dpad-btn stop" data-dir="stop" title="Stop">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
          <button class="dpad-btn right" data-dir="right" title="Right" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
          <button class="dpad-btn back" data-dir="backward" title="Backward" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
          </button>
        </div>
        <div class="pwm-control">
          <label>PWM Speed <span id="pwmValue">160</span></label>
          <input type="range" id="pwmSlider" min="0" max="255" value="160" />
        </div>
      </div>

      <button id="estop" class="estop-btn">Emergency Stop</button>
    </section>

    <aside class="card log-panel">
      <div class="log-header">
        <h2>Transmission Log</h2>
        <button class="clear-btn" id="clearLog">Clear</button>
      </div>
      <div class="log-list" id="logList">
        <div class="log-empty" id="logEmpty">No activity yet. Connect to the robot to begin.</div>
      </div>
    </aside>
  </div>
</div>

<script>
/*
  ============================================================
  Expected robot-side REST API (to be implemented on the ESP32
  via esp_http_server). Base URL = http://<robotIp>

  GET  /api/status
       -> { connected: true, mode: "autonomous"|"manual",
            state: "idle"|"searching"|"following_line"|"arrived"|"obstacle",
            distance_cm: number, last_color: "none"|"red"|"green"|"blue"|"yellow"|"black" }

  POST /api/mode            body: { mode: "autonomous" | "manual" }
  POST /api/autonomous/start body: { target_color: "red"|"green"|"blue"|"yellow" }
  POST /api/autonomous/stop
  POST /api/manual/move     body: { direction: "forward"|"backward"|"left"|"right"
                                      |"spin_cw"|"spin_ccw"|"stop", pwm: 0-255 }
  POST /api/estop

  Safety note for the firmware side: implement a command timeout
  (e.g. auto-stop if no /api/manual/move call arrives within ~500ms
  of the last one) so a dropped WiFi connection mid-press doesn't
  leave the robot driving indefinitely.
  ============================================================
*/

const state = {
  connected: false,
  baseUrl: '',
  mode: 'autonomous',
  targetColor: null,
  pollTimer: null,
};

const el = (id) => document.getElementById(id);
const logList = el('logList');
const logEmpty = el('logEmpty');

function logEvent(message, type = 'info') {
  if (logEmpty) logEmpty.remove();
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  const time = new Date().toLocaleTimeString([], { hour12: false });
  entry.innerHTML = `<div class="log-dot"></div><div class="log-body"><span class="log-msg"></span><span class="log-time">${time}</span></div>`;
  entry.querySelector('.log-msg').textContent = message;
  logList.prepend(entry);
  const entries = logList.querySelectorAll('.log-entry');
  if (entries.length > 100) entries[entries.length - 1].remove();
}

el('clearLog').addEventListener('click', () => {
  logList.innerHTML = '';
  logEmpty && logList.appendChild(logEmpty);
  const fresh = document.createElement('div');
  fresh.className = 'log-empty';
  fresh.textContent = 'No activity yet.';
  logList.innerHTML = '';
  logList.appendChild(fresh);
});

async function apiCall(path, body) {
  if (!state.connected) {
    logEvent('Not connected - command ignored.', 'error');
    return null;
  }
  try {
    const res = await fetch(state.baseUrl + path, {
      method: body ? 'POST' : 'GET',
      headers: body ? { 'Content-Type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json().catch(() => ({}));
  } catch (err) {
    logEvent(`Request failed: ${path} (${err.message})`, 'error');
    return null;
  }
}

/* ---------------- Connection ---------------- */
function setConnected(isConnected) {
  state.connected = isConnected;
  const btn = el('connectBtn');
  const pill = el('statusPill');
  const label = el('statusLabel');
  const connectLabel = el('connectLabel');

  btn.classList.toggle('connected', isConnected);
  connectLabel.textContent = isConnected ? 'Disconnect' : 'Connect';
  pill.classList.toggle('live', isConnected);
  label.textContent = isConnected ? 'Connected' : 'Disconnected';

  document.querySelectorAll('.dpad-btn[data-dir]:not([data-dir="stop"])').forEach(b => b.disabled = !isConnected);
  el('startAuto').disabled = !isConnected || !state.targetColor;
  el('stopAuto').disabled = !isConnected;
}

async function pollStatus() {
  const data = await apiCall('/api/status');
  if (!data) return;
  if (typeof data.distance_cm === 'number') {
    // available for future use (e.g. a live distance readout)
  }
  if (data.state) {
    el('autoState').textContent = data.state.replace(/_/g, ' ');
  }
}

el('connectBtn').addEventListener('click', () => {
  if (state.connected) {
    clearInterval(state.pollTimer);
    setConnected(false);
    logEvent('Disconnected from robot.', 'warn');
    return;
  }
  const ip = el('robotIp').value.trim();
  if (!ip) {
    logEvent('Enter the robot\'s IP address first.', 'error');
    return;
  }
  state.baseUrl = `http://${ip}`;
  logEvent(`Connecting to ${ip}...`, 'info');

  // Use a raw fetch here (not apiCall) - apiCall refuses to run until
  // state.connected is true, so it can never be used for the initial
  // reachability check that sets state.connected in the first place.
  fetch(state.baseUrl + '/api/status')
    .then((res) => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    })
    .then((data) => {
      setConnected(true);
      logEvent(`Connected to robot at ${ip}.`, 'success');
      state.pollTimer = setInterval(pollStatus, 1000);
    })
    .catch((err) => {
      logEvent(`Could not reach robot. Check IP and network. (${err.message})`, 'error');
    });
});

/* ---------------- Mode toggle ---------------- */
document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    const mode = btn.dataset.mode;
    if (mode === state.mode) return;
    state.mode = mode;
    el('modeToggle').dataset.active = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
    el('autonomousPanel').classList.toggle('active', mode === 'autonomous');
    el('manualPanel').classList.toggle('active', mode === 'manual');
    await apiCall('/api/mode', { mode });
    logEvent(`Switched to ${mode} mode.`, 'info');
  });
});

/* ---------------- Autonomous ---------------- */
document.querySelectorAll('.color-swatch').forEach(swatch => {
  swatch.addEventListener('click', () => {
    document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected'));
    swatch.classList.add('selected');
    state.targetColor = swatch.dataset.color;
    el('startAuto').disabled = !state.connected;
  });
});

el('startAuto').addEventListener('click', async () => {
  if (!state.targetColor) return;
  const res = await apiCall('/api/autonomous/start', { target_color: state.targetColor });
  if (res) logEvent(`Mission started - searching for ${state.targetColor}.`, 'success');
});

el('stopAuto').addEventListener('click', async () => {
  const res = await apiCall('/api/autonomous/stop');
  if (res) logEvent('Autonomous mission stopped.', 'warn');
});

/* ---------------- Manual controls ---------------- */
const pwmSlider = el('pwmSlider');
const pwmValue = el('pwmValue');
function updatePwmTrack() {
  const pct = (pwmSlider.value / pwmSlider.max) * 100;
  pwmSlider.style.setProperty('--pct', pct + '%');
  pwmValue.textContent = pwmSlider.value;
}
pwmSlider.addEventListener('input', updatePwmTrack);
updatePwmTrack();

let activeDir = null;
document.querySelectorAll('.dpad-btn[data-dir]').forEach(btn => {
  const dir = btn.dataset.dir;

  const press = async (e) => {
    e.preventDefault();
    if (btn.disabled) return;
    btn.classList.add('pressed');
    activeDir = dir;
    await apiCall('/api/manual/move', { direction: dir, pwm: Number(pwmSlider.value) });
    if (dir !== 'stop') logEvent(`Manual: ${dir.replace('_', ' ')} @ PWM ${pwmSlider.value}`, 'info');
    else logEvent('Manual: stop', 'warn');
  };

  const release = async () => {
    if (dir === 'stop' || activeDir !== dir) return;
    btn.classList.remove('pressed');
    activeDir = null;
    await apiCall('/api/manual/move', { direction: 'stop', pwm: 0 });
  };

  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointerleave', release);
  btn.addEventListener('pointercancel', release);
});

/* ---------------- Emergency stop ---------------- */
el('estop').addEventListener('click', async () => {
  const res = await apiCall('/api/estop');
  if (res) logEvent('EMERGENCY STOP triggered.', 'error');
});
</script>
</body>
</html>
